name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/out/tinta-android-1.0.0-debug.apk"
          cd "$RUNNER_TEMP/out"
          sha256sum tinta-android-1.0.0-debug.apk > SHA256SUMS.txt
          git -C "$GITHUB_WORKSPACE" archive \
            --format=zip \
            --output="$RUNNER_TEMP/out/tinta-1.0.0-source.zip" \
            HEAD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tinta-android-debug
          path: |
            ${{ runner.temp }}/out/tinta-android-1.0.0-debug.apk
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: tinta-source
          path: ${{ runner.temp }}/out/tinta-1.0.0-source.zip
          if-no-files-found: error
          retention-days: 30
